[package]
name = "mini-teclado-usb"
version = "0.8.0-alpha.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Configurator for AliExpress USB macro keypads and rotary encoders"
repository = "https://github.com/soldieg/aliexpress-macropad-configurator"
publish = false

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
arabic_reshaper = "0.4.2"
unicode-bidi = "0.3.18"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Globalization"] }
windows = { version = "0.62.2", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wayland", "x11"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
tray-icon = { version = "0.27.0", default-features = false }

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1




